spring:
  config:
    activate:
      on-profile: dev

  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://postgres_db:5432/${DB_NAME}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
    show-sql: true

  liquibase:
    contexts: dev
    drop-first: false

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${PUBLIC_KEY_PATH:classpath:publicKey.pem}

application:
  private-key-path: file:${PRIVATE_KEY_PATH:classpath:privateKey.pem}
  public-key-path: file:${PUBLIC_KEY_PATH:classpath:publicKey.pem}