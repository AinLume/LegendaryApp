spring:
  config:
    activate:
      on-profile: local

  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
    username: postgres
    password: secretPass123
    url: jdbc:postgresql://localhost:5432/restaurant_db

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
    show-sql: true

  liquibase:
    contexts: dev
    drop-first: false