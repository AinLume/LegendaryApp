spring:
  application:
    name: CafeCRM

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    time-zone: Europe/Moscow

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true

springdoc:
  swagger-ui:
    path: /docs
    enabled: true
  api-docs:
    path: /api-docs
    enabled: true
  packages-to-scan: org.example.cafecrm.controller